<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ff">
  <title>Hola mundo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #24213a;
      background: #f5f3ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 15% 10%, #e0e7ff 0, transparent 38%),
                  radial-gradient(ellipse at 90% 90%, #fce7f3 0, transparent 35%), #f8f7ff;
    }
    main {
      width: min(100%, 620px);
      padding: clamp(36px, 8vw, 72px);
      text-align: center;
      background: rgba(255, 255, 255, .82);
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(65, 54, 120, .13);
      backdrop-filter: blur(12px);
    }
    .sparkle {
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 20px;
      color: #fff;
      font-size: 30px;
      background: linear-gradient(135deg, #8175ee, #bb72db);
      box-shadow: 0 10px 24px rgba(129, 117, 238, .3);
    }
    h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 4rem); letter-spacing: -.055em; }
    p { margin: 16px 0 0; color: #77738e; font-size: 1.05rem; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <div class="sparkle" aria-hidden="true">✦</div>
    <h1>Hola mundo</h1>
    <p>Un pequeño comienzo para una gran idea.</p>
  </main>
</body>
</html>
